name: Android Build Command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    if: github.event.comment.body == '!android-debug-arm64'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ARM64 Debug build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-manual.yml \
            --repo "${{ github.repository }}" \
            --ref android-display-input-fix \
            -f build_type=Debug \
            -f arch=arm64
