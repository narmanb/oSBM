name: Android ARM64 Debug (Auto)

on:
  push:
    branches:
      - android-display-input-fix

permissions:
  actions: write
  contents: read

jobs:
  dispatch-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Start ARM64 Debug build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-manual.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f build_type=Debug \
            -f arch=arm64
